        }
        // 显示专辑浮框
        function showAlbumFloat() {
            if (!decryptedData || !decryptedData.albums || decryptedData.albums.length === 0) {
                alert('没有可用的专辑数据');
                return;
            }
            
            allAlbums = decryptedData.albums;
            renderAlbumList();
            
            const albumFloat = document.getElementById('albumFloat');
            albumFloat.style.display = 'block';
            isAlbumFloatVisible = true;
            
            // // 添加点击外部关闭浮框的事件
            // setTimeout(() => {
            //     document.addEventListener('click', closeAlbumFloatOnClickOutside);
            // }, 100);
        }
        // 显示所有照片
        function showAllPhotos() {
            // 移除现有标记
            photoMarkers.forEach(marker => {
                map.removeLayer(marker);
            });
            photoMarkers = [];

            // 重置专辑状态
            isAlbumView = false;
            currentAlbum = null;

            // 重新添加所有照片
            if (decryptedData && decryptedData.photos) {
                decryptedData.photos.forEach(photo => {
                    addPhotoToMap(photo);
                });
            }
            
            // 更新聚类
            updatePhotoClusters();
        }
        // 路线颜色池（12色）
        const routeColors = [
            '#2196F3', '#9C27B0', '#FF9800', '#009688', '#E91E63',
            '#795548', '#607D8B', '#4CAF50', '#FF5722', '#3F51B5',
            '#FFC107', '#8BC34A'
        ];

        // 根据路线 id 生成固定颜色
        function getRouteColor(routeId) {
            let hash = 0;
            for (let i = 0; i < routeId.length; i++) {
                hash = ((hash << 5) - hash) + routeId.charCodeAt(i);
                hash = hash & hash;
            }
            return routeColors[Math.abs(hash) % routeColors.length];
        }
        // 格式化距离/时间（保持原有）
        function formatDistance(meters) {
            return meters < 1000 ? `${meters.toFixed(0)} 米` : `${(meters / 1000).toFixed(1)} 公里`;
        }
        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
            return h ? `${h} 小时 ${m} 分钟` : `${m} 分钟`;
        }        
        
        // 定位当前照片到地图
        function locateCurrentPhoto() {
            if (currentViewerMarkers.length === 0 || !isAlbumView) return;
            
            const marker = currentViewerMarkers[currentPhotoIndex];
            const photoData = marker.photoData;

            if (firstLocation){
                albumPhotoIndex = currentPhotoIndex;

               closeAlbumFloat(true);

            map.setView([photoData.lat, photoData.lng], 10);
            
            // 高亮显示当前照片标记
            // highlightPhotoMarker(photoData);
            
            // 显示返回提示和返回按钮
            const returnTip = document.getElementById('albumReturnTip');
            returnTip.innerHTML = `
                <i class="fas fa-map-marker-alt"></i> 
                <span>已定位到照片位置</span>
                <button class="btn btn-sm btn-light ms-2" onclick="returnToAlbumView(${albumPhotoIndex})">
                    <i class="fas fa-arrow-left"></i> 返回专辑
                </button>
            `;
            returnTip.style.display = 'flex';


        }        
        // 绘制所有选中的路线
        function renderSelectedRoutes() {
            // 关闭所有已打开的路线弹框
            routes.forEach(route => {
                if (route._popup) {
                    map.closePopup(route._popup);
                    route._popup = null;
                }
            });

            if (!routeLayerGroup || !map.hasLayer(routeLayerGroup)) {
                initRouteLayer();
            }
            routeLayerGroup.clearLayers();

            const boundsPoints = [];
            selectedRouteIds.forEach(id => {
                const route = routes.find(r => r.id === id);
                if (route) drawRoute(route, boundsPoints);
            });

            // 自动缩放至所有选中路线的范围
            if (boundsPoints.length > 1) {
                const bounds = L.latLngBounds(boundsPoints);
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            } else if (boundsPoints.length === 1) {
                map.setView(boundsPoints[0], 12);
            }
        }        
        
        // 以及其他辅助函数

        // 由于代码长度限制，这里不复制所有函数
        // 实际使用时需要从原文件复制剩余的函数实现

        // ==================== 时间旅行模式 ====================

        // Konami Code检测
        let konamiCode = [];
        const konamiSequence = [
            'ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown',
            'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight',
            'b', 'a'
        ];

        function detectKonamiCode(e) {
            // 添加当前按键
            konamiCode.push(e.key);

            // 保持数组长度不超过序列长度
            if (konamiCode.length > konamiSequence.length) {
                konamiCode.shift();
            }

            // 检查是否匹配Konami Code
            if (konamiCode.length === konamiSequence.length) {
                let match = true;
                for (let i = 0; i < konamiSequence.length; i++) {
                    if (konamiCode[i] !== konamiSequence[i]) {
                        match = false;
                        break;
                    }
                }

                if (match) {
                    // 激活时间旅行彩蛋
                    activateTimeTravelEasterEgg();

                    // 清空检测数组
                    konamiCode = [];
                }
            }
        }

        // 激活时间旅行彩蛋（通过Konami Code或其他方式）
        function activateTimeTravelEasterEgg() {
            // 显示时间旅行按钮
            document.getElementById('timeTravelBtnGroup').style.display = 'flex';

            // 显示提示信息
            showNotification('🎉 彩蛋解锁！时间旅行模式已激活', 'success');

            // 播放解锁音效（可选）
            playUnlockSound();
        }

        // 切换时间旅行模式
        function toggleTimeTravel() {
            timeTravelMode = !timeTravelMode;
            const panel = document.getElementById('timeTravelPanel');

            if (timeTravelMode) {
                // 进入时间旅行模式
                panel.classList.add('active');
                initTimeTravelMode();
            } else {
                // 退出时间旅行模式
                panel.classList.remove('active');
                stopTimeTravel();
                resetTimeTravelMarkers();
            }
        }

        // 初始化时间旅行模式
        function initTimeTravelMode() {
            if (!decryptedData || !decryptedData.photos) {
                showNotification('请先加载照片数据', 'warning');
                return;
            }

            // 按拍摄时间排序照片
            timeTravelPhotos = [...decryptedData.photos].sort((a, b) => {
                const timeA = new Date(a.shotTime || a.timestamp || '1970-01-01');
                const timeB = new Date(b.shotTime || b.timestamp || '1970-01-01');
                return timeA - timeB;
            });

            // 更新UI
            updateTimeTravelUI();

            // 创建时间旅行标记
            createTimeTravelMarkers();

            // 设置滑块最大值
            document.getElementById('timeTravelSlider').max = timeTravelPhotos.length - 1;

            // 开始播放
            startTimeTravel();
        }

        // 创建时间旅行标记
        function createTimeTravelMarkers() {
            // 清除现有标记
            resetTimeTravelMarkers();

            // 为每张照片创建标记
            timeTravelPhotos.forEach((photo, index) => {
                const marker = L.marker([photo.lat, photo.lng], {
                    icon: L.divIcon({
                        className: 'time-marker',
                        html: `<div>${index + 1}</div>`,
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    })
                });

                // 添加点击事件
                marker.on('click', () => {
                    jumpToTimeTravelPhoto(index);
                });

                marker.addTo(map);
                marker.photoIndex = index;
                timeTravelMarkers.push(marker);
            });

            // 激活第一个标记
            activateTimeTravelMarker(0);
        }

        // 激活指定索引的时间旅行标记
        function activateTimeTravelMarker(index) {
            // 清除之前的激活状态
            if (timeTravelActiveMarker) {
                timeTravelActiveMarker.getElement().classList.remove('active');
            }

            // 激活新标记
            if (timeTravelMarkers[index]) {
                timeTravelActiveMarker = timeTravelMarkers[index];
                timeTravelActiveMarker.getElement().classList.add('active');

                // 将地图视图移动到标记位置
                map.setView(timeTravelActiveMarker.getLatLng(), 12);
            }
        }

        // 重置时间旅行标记
        function resetTimeTravelMarkers() {
            timeTravelMarkers.forEach(marker => {
                map.removeLayer(marker);
            });
            timeTravelMarkers = [];
            timeTravelActiveMarker = null;
        }

        // 跳转到指定时间旅行照片
        function jumpToTimeTravelPhoto(index) {
            if (index < 0 || index >= timeTravelPhotos.length) return;

            timeTravelCurrentIndex = index;
            updateTimeTravelUI();
            activateTimeTravelMarker(index);

            // 更新滑块
            document.getElementById('timeTravelSlider').value = index;
        }

        // 开始时间旅行
        function startTimeTravel() {
            if (timeTravelIsPlaying) return;

            timeTravelIsPlaying = true;
            document.getElementById('timeTravelPlayIcon').className = 'fas fa-pause';

            // 获取播放速度
            timeTravelIntervalTime = parseInt(document.getElementById('timeTravelSpeed').value);

            // 开始播放
            timeTravelInterval = setInterval(() => {
                timeTravelCurrentIndex++;
                if (timeTravelCurrentIndex >= timeTravelPhotos.length) {
                    timeTravelCurrentIndex = 0; // 循环播放
                }

                jumpToTimeTravelPhoto(timeTravelCurrentIndex);
            }, timeTravelIntervalTime);
        }

        // 暂停时间旅行
        function pauseTimeTravel() {
            if (!timeTravelIsPlaying) return;

            timeTravelIsPlaying = false;
            document.getElementById('timeTravelPlayIcon').className = 'fas fa-play';

            if (timeTravelInterval) {
                clearInterval(timeTravelInterval);
                timeTravelInterval = null;
            }
        }

        // 停止时间旅行
        function stopTimeTravel() {
            pauseTimeTravel();
            timeTravelCurrentIndex = 0;
            updateTimeTravelUI();
        }

        // 切换播放/暂停
        function toggleTimeTravelPlay() {
            if (timeTravelIsPlaying) {
                pauseTimeTravel();
            } else {
                startTimeTravel();
            }
        }

        // 更新时间旅行UI
        function updateTimeTravelUI() {
            if (timeTravelPhotos.length === 0) return;

            const currentPhoto = timeTravelPhotos[timeTravelCurrentIndex];
            const totalPhotos = timeTravelPhotos.length;

            // 更新计数器
            document.getElementById('timeTravelCurrent').textContent =
                `第 ${timeTravelCurrentIndex + 1} 张 / 共 ${totalPhotos} 张`;

            // 更新日期
            if (currentPhoto.shotTime) {
                document.getElementById('timeTravelDate').textContent =
                    `日期: ${formatDate(currentPhoto.shotTime)}`;
            }
        }

        // 格式化日期
        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                return dateString;
            }
        }

        // 播放解锁音效
        function playUnlockSound() {
            // 创建简单的音效
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                // 音效失败时不处理
            }
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            notification.style.cssText = `
                top: 20px;
                right: 20px;
                z-index: 2000;
                min-width: 300px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            `;
            notification.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;

            document.body.appendChild(notification);

            // 5秒后自动移除
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 5000);
        }

        // 初始化时间旅行事件监听器（在页面加载完成后）
        function initTimeTravelEventListeners() {
            const slider = document.getElementById('timeTravelSlider');
            const speedSelect = document.getElementById('timeTravelSpeed');

            if (slider) {
                slider.addEventListener('input', function(e) {
                    const index = parseInt(e.target.value);
                    jumpToTimeTravelPhoto(index);
                });
            }

            if (speedSelect) {
                speedSelect.addEventListener('change', function(e) {
                    timeTravelIntervalTime = parseInt(e.target.value);

                    // 如果正在播放，重新开始以应用新速度
                    if (timeTravelIsPlaying) {
                        pauseTimeTravel();
                        startTimeTravel();
                    }
                });
            }
        }
        
        
        </script>

    <!-- 时间旅行控制面板 -->

                <span id="timeTravelCurrent">第 0 张 / 共 0 张</span>
