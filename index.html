<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回忆良药铺</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CryptoJS库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <link rel="stylesheet" type="text/css" href="css/style.css">

    <style>
        /* 壁纸模式样式 */
        .wallpaper-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .wallpaper-mode.active {
            display: block;
            opacity: 1;
        }

        .wallpaper-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .wallpaper-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(30px) brightness(0.7) saturate(1.2);
            z-index: 1;
            opacity: 0;
            transition: opacity 1.5s ease, filter 1.5s ease;
            transform: scale(1.05); /* 轻微放大避免边缘模糊 */
        }

        .wallpaper-background.active {
            opacity: 1;
            filter: blur(20px) brightness(0.8) saturate(1.1);
        }

        .wallpaper-background.active {
            opacity: 1;
        }

        .wallpaper-foreground {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 2;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset,
                0 0 30px rgba(255, 255, 255, 0.05) inset;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 95vw;
            max-height: 95vh;
        }

        .wallpaper-foreground.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .wallpaper-foreground img {
            object-fit: contain;
            display: block;
            border-radius: 20px;
            /* 默认值，会被下面的特定方向规则覆盖 */
            max-width: 95vw;
            max-height: 95vh;
        }

        /* 宽度优先 - 照片宽度会先达到95vw限制 */
        .wallpaper-foreground img.width-limited {
            max-width: 95vw;
            width: 95vw;
            height: auto;
            max-height: 95vh;
        }

        /* 高度优先 - 照片高度会先达到95vh限制 */
        .wallpaper-foreground img.height-limited {
            max-height: 95vh;
            height: 95vh;
            width: auto;
            max-width: 95vw;
        }

        .wallpaper-image {
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .wallpaper-image.active {
            opacity: 1;
        }



        .wallpaper-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 2001;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .wallpaper-controls:hover {
            opacity: 1;
        }

        .wallpaper-controls.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .wallpaper-info.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .wallpaper-exit-hint.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 鼠标指针隐藏 */
        .wallpaper-mode.cursor-hidden {
            cursor: none;
        }

        /* 禁用过渡的类 */
        .wallpaper-no-transition,
        .wallpaper-no-transition * {
            transition: none !important;
        }

        .wallpaper-btn {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .wallpaper-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .wallpaper-info {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 2001;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .wallpaper-info:hover {
            opacity: 1;
        }

        .wallpaper-progress {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            z-index: 2001;
        }

        .wallpaper-progress-bar {
            height: 100%;
            background-color: white;
            width: 0%;
            transition: width 0.5s linear;
        }

        .wallpaper-exit-hint {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: center;
            z-index: 2001;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        /* 壁纸地图容器样式 */
        #wallpaperMapContainer {
            transition: opacity 0.3s ease;
        }

        #wallpaperMapContainer.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 迷你地图样式覆盖 */
        #wallpaperMiniMap .leaflet-control-zoom {
            display: none;
        }

        #wallpaperMiniMap .leaflet-control-attribution {
            display: none;
        }

        #wallpaperMiniMap .leaflet-tile {
            filter: brightness(0.9) contrast(1.3) saturate(1.1) opacity(0.7);
        }

        /* 地图边界线 */
        #wallpaperMiniMap {
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* 地图容器半透明效果 */
        #wallpaperMapContainer {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(10px) !important;
        }

        /* 地图半透明覆盖层 */
        #wallpaperMapContainer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
            z-index: 1;
            border-radius: 10px;
        }

        /* 确保地图在覆盖层之上 */
        #wallpaperMiniMap {
            position: relative;
            z-index: 2;
        }

        /* 壁纸地图标记动画 */
        .wallpaper-map-marker {
            animation: pulse-map-marker 2s infinite;
        }

        /* 搜索候选结果样式 */
        #search-suggestions .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        #search-suggestions .suggestion-item:hover {
            background-color: #f8f9fa;
        }

        #search-suggestions .suggestion-item.active {
            background-color: #e9ecef;
        }

        #search-suggestions .suggestion-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 2px;
        }

        #search-suggestions .suggestion-address {
            font-size: 12px;
            color: #666;
        }

        #search-suggestions .suggestion-region {
            font-size: 11px;
            color: #888;
        }

        @keyframes pulse-map-marker {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            70% { opacity: 1; } /* 前70%时间保持显示（约2.1秒） */
            100% { opacity: 0; } /* 最后30%时间淡出（约0.9秒） */
        }

        /* 壁纸按钮样式 */
        .btn-wallpaper {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-wallpaper:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        /* 时间旅行模式样式 */
        .btn-time-travel {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-time-travel:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .time-travel-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-width: 500px;
        }

        .time-travel-panel.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .time-travel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .time-travel-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
        }

        .time-travel-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .time-travel-timeline {
            margin: 15px 0;
        }

        .time-travel-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, #f093fb, #f5576c);
            border-radius: 3px;
            outline: none;
        }

        .time-travel-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            border: 2px solid #f5576c;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .time-travel-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .time-travel-speed {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-travel-speed select {
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: white;
        }

        .time-marker {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(245, 87, 108, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1001;
            box-shadow: 0 3px 10px rgba(245, 87, 108, 0.3);
        }

        .time-marker:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .time-marker.active {
            background: #4CAF50;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.3);
        }
    </style>

</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">回忆良药铺</span>

            <!-- 添加搜索框 -->
            <div class="d-flex align-items-center me-3 position-relative">
                <div class="input-group">
                    <input type="text" id="search-input" class="form-control" placeholder="输入地址进行搜索..." style="max-width: 250px;">
                    <button class="btn btn-outline-primary" type="button" onclick="searchLocation()">
                        <i class="fas fa-search"></i>
                    </button>
                    <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()" title="清除搜索标记">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <!-- 候选结果容器 -->
                <div id="search-suggestions" class="position-absolute top-100 start-0 mt-1 w-100 bg-white border rounded shadow-lg" style="z-index: 1050; display: none; max-height: 300px; overflow-y: auto;">
                    <div id="suggestions-list" class="list-group list-group-flush"></div>
                </div>
            </div>

            <div class="d-flex">

                <div class="btn-group me-2" role="group">
                    <button id="routeBtn" type="button" class="btn btn-outline-secondary" onclick="toggleRouteFloat()">
                        <i class="fas fa-location-arrow"></i> 路线
                    </button>
                </div>

                <!-- 在导航栏搜索框后添加专辑选择器 -->
                <div class="btn-group me-2" role="group">
                    <button id="albumBtn" type="button" class="btn btn-outline-secondary" onclick="toggleAlbumFloat()">
                        <i class="fas fa-folder"></i> 专辑
                    </button>
                </div>


                <!-- 地图源切换按钮 -->
                <div class="btn-group me-2" role="group">
                    <button id="mapSourceBtn" type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-layer-group"></i> 地图样式
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item map-source-option active" href="#" data-source=0>标准地图</a></li>
                        <li><a class="dropdown-item map-source-option" href="#" data-source=1>卫星影像</a></li>
                        <li><a class="dropdown-item map-source-option" href="#" data-source=2>卫星影像（含路网）</a></li>
                    </ul>
                </div>

                <!-- 壁纸按钮 -->
                <div class="btn-group me-2" role="group">
                    <button id="wallpaperBtn" type="button" class="btn btn-wallpaper" data-bs-toggle="modal" data-bs-target="#wallpaperSettingsModal">
                        <i class="fas fa-image"></i> 壁纸
                    </button>
                </div>

                <!-- 时间旅行按钮（隐藏，通过彩蛋激活） -->
                <div class="btn-group me-2" role="group" id="timeTravelBtnGroup" style="display: none;">
                    <button id="timeTravelBtn" type="button" class="btn btn-time-travel" onclick="toggleTimeTravel()">
                        <i class="fas fa-clock"></i> 时间旅行
                    </button>
                </div>

                <button class="btn btn-outline-info" onclick="toggleFullScreen()">
                    <i class="fas fa-expand"></i> 全屏
                </button>
            </div>
        </div>
    </nav>

    <!-- 路线浮框 -->
    <div id="routeFloat" class="card" style="position: fixed; top: 70px; left: 20px; width: 300px; z-index: 1000; display: none; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0"><i class="fas fa-route me-1"></i> 选择路线</h6>
            <button type="button" class="btn-close" onclick="closeRouteFloat()"></button>
        </div>
        <div class="card-body p-0">
            <div id="routeList" style="max-height: 400px; overflow-y: auto;">
                <!-- 路线列表将通过JS动态添加 -->
            </div>
        </div>
        <div class="card-footer">
            <button type="button" class="btn btn-sm btn-outline-secondary w-100" onclick="closeRouteFloat()">
                关闭
            </button>
        </div>
    </div>

    <!-- 专辑浮框 -->
    <div id="albumFloat" class="card" style="position: fixed; top: 70px; right: 20px; width: 300px; z-index: 1000; display: none; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0"><i class="fas fa-images me-1"></i> 选择专辑</h6>
            <button type="button" class="btn-close" onclick="closeAlbumFloat(false)"></button>
        </div>
        <div class="card-body p-0">
            <div id="albumList" style="max-height: 400px; overflow-y: auto;">
                <!-- 专辑列表将通过JS动态添加 -->
            </div>
        </div>
        <div class="card-footer">
            <button type="button" class="btn btn-sm btn-outline-secondary w-100" onclick="closeAlbumFloat(false)">
                关闭
            </button>
        </div>
    </div>

    <!-- 在照片查看器后添加返回提示 -->
    <div id="albumReturnTip" class="alert alert-info" style="position: fixed; top: 100px; left: 50%; transform: translateX(-50%); z-index: 1001; display: none;">
        <i class="fas fa-mouse-pointer"></i> 点击任意位置返回专辑
    </div>

    <!-- 数据更新提示弹窗 -->
    <div id="updateNotification" class="update-notification">
        <div class="update-notification-content">
            <i class="fas fa-info-circle"></i>
            <span id="updateMessage">数据更新至 <span id="updateTime"></span></span>
        </div>
    </div>

    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- 照片查看器 -->
    <div class="photo-viewer" id="photoViewer">
        <div class="close-btn" id="cbt" onclick="closePhotoViewer()">
            <i class="fas fa-times"></i>
        </div>

        <div class="photo-container">
            <div class="photo-display">
                <img class="main-photo" id="mainPhoto" src="" alt="Photo">
            </div>
        </div>

        <div class="photo-controls">
            <div class="nav-btn prev-btn" onclick="navigatePhoto(-1)">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="nav-btn next-btn" onclick="navigatePhoto(1)">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <div class="photo-toolbar">
            <button class="toolbar-btn" onclick="toggleDetails()">
                <i class="fas fa-info-circle"></i> 详情
            </button>
            <button class="toolbar-btn" id="locateBtn" onclick="locateCurrentPhoto()" style="display: none;">
                <i class="fas fa-map-marker-alt"></i> 定位
            </button>
            <button class="toolbar-btn" onclick="downloadCurrentPhoto()">
                <i class="fas fa-download"></i> 下载
            </button>
        </div>

        <div class="photo-preview-container" id="ppc">
            <button class="preview-nav-btn preview-prev-btn" onclick="scrollPreviews(-1)">
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="photo-preview" id="photoPreview">
                <!-- 预览小图将通过JS动态添加 -->
            </div>

            <button class="preview-nav-btn preview-next-btn" onclick="scrollPreviews(1)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="photo-details" id="photoDetails">
            <h3>照片详情</h3>
            <div class="detail-item">
                <label>位置</label>
                <div class="value" id="detailLocation"></div>
            </div>
            <div class="detail-item">
                <label>尺寸</label>
                <div class="value" id="detailDimensions"></div>
            </div>
            <div class="detail-item">
                <label>文件名称</label>
                <div class="value" id="detailFilename"></div>
            </div>
            <div class="detail-item">
                <label>拍摄时间</label>
                <div class="value" id="shotTime"></div>
            </div>

            <div class="note-section">
                <h4>备注</h4>
                <div class="note-content" id="noteContent">
                    <!-- 备注内容将通过JS动态添加 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 壁纸模式 -->
    <div class="wallpaper-mode" id="wallpaperMode">
        <div class="wallpaper-container" id="wallpaperContainer">
            <!-- 壁纸图片将通过JS动态添加 -->
        </div>
        <div class="wallpaper-info" id="wallpaperInfo">
            <span id="wallpaperCurrent">1</span> / <span id="wallpaperTotal">0</span> - <span id="wallpaperFilename"></span>
        </div>
        <div class="wallpaper-controls">
            <button class="wallpaper-btn" onclick="prevWallpaper()" title="上一张">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="wallpaper-btn" onclick="toggleWallpaperPlay()" title="播放/暂停" id="wallpaperPlayBtn">
                <i class="fas fa-pause" id="wallpaperPlayIcon"></i>
            </button>
            <button class="wallpaper-btn" onclick="nextWallpaper()" title="下一张">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div class="wallpaper-progress">
            <div class="wallpaper-progress-bar" id="wallpaperProgressBar"></div>
        </div>
        <div class="wallpaper-exit-hint" id="wallpaperExitHint">
            单击屏幕或按ESC键退出
        </div>
        <!-- 地理显示地图容器 -->
        <div id="wallpaperMapContainer" style="position: absolute; top: 30px; right: 30px; width: 300px; height: 200px; z-index: 2001; display: none; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);">
            <div id="wallpaperMiniMap" style="width: 100%; height: 100%;"></div>
        </div>
    </div>

    <!-- 壁纸设置模态框 -->
    <div class="modal fade" id="wallpaperSettingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

        // 初始化地图
        function initMap() {
            // 创建地图实例，设置中心点和缩放级别
            map = L.map('map').setView([35.8617, 104.1954], 5); // 中国中心点

            // 使用高德地图瓦片

                attribution: '&copy; <a href="https://ditu.amap.com/">高德地图</a>',
                maxZoom: 19,
                subdomains: ['1', '2', '3', '4']
            });

            // 卫星地图
            satellite = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=6', {
                attribution: '&copy; <a href="https://ditu.amap.com/">高德地图</a>',
                maxZoom: 19,
                subdomains: ['1', '2', '3', '4']
            });

            // 卫星地图-路网
            satellite_road = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8', {
                attribution: '&copy; <a href="https://ditu.amap.com/">高德地图</a>',
                maxZoom: 19,
                subdomains: ['1', '2', '3', '4']
            });

            mapLoader['cur'] = -1; // 缺省值
            mapLoader['set'] = [standard, satellite, satellite_road]

            // 默认地图
            switchMapSource(mapLoader['cur']);

            // 监听搜索框的回车键
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchLocation();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closePhotoViewer();
                } else if (e.key === 'ArrowLeft') {
                    navigatePhoto(-1);
                } else if (e.key === 'ArrowRight') {
                    navigatePhoto(1);
                }

                // 检测Konami Code
                detectKonamiCode(e);
            });
            // 注意：loadPredefinedPhotos() 的调用已移到 a.encrypted 检查之后
            // 这里不再直接调用，避免在数据未解密时显示密码模态框
        }

        // 初始化路线图层组（确保始终在地图上）
        function initRouteLayer() {
            if (routeLayerGroup) {
                if (map.hasLayer(routeLayerGroup)) map.removeLayer(routeLayerGroup);
                routeLayerGroup = null;
            }
            routeLayerGroup = L.layerGroup().addTo(map);
        }

        function switchMapSource(switchTo) {
            if (switchTo === -1){
                mapLoader['set'][0].addTo(map);
                mapLoader['cur'] = 0;
                return;
            }

            if (mapLoader['cur'] === switchTo){
                return;
            }

            // 移除当前地图层
            if (switchTo === 0) {
                try{
                    map.removeLayer(mapLoader['set'][2]);
                } catch {}
                map.removeLayer(mapLoader['set'][1]);
                mapLoader['set'][0].addTo(map);
                mapLoader['cur'] = 0;
            } else if(switchTo === 1){
                try{
                    map.removeLayer(mapLoader['set'][2]);
                } catch {}
                try{
                    map.removeLayer(mapLoader['set'][0]);
                    mapLoader['set'][1].addTo(map);
                } catch {}
                mapLoader['cur'] = 1;
            } else{
                try{
                    map.removeLayer(mapLoader['set'][0]);
                    mapLoader['set'][1].addTo(map);
                    mapLoader['set'][2].addTo(map);
                } catch {
                    mapLoader['set'][2].addTo(map);
                }
                mapLoader['cur'] = 2;
            }

            // 更新按钮状态
            updateMapSourceButtonState(switchTo);

        }

        // 更新地图源按钮状态
        function updateMapSourceButtonState(sourceKey) {
            // 更新下拉菜单选项状态
            document.querySelectorAll('.map-source-option').forEach(option => {
                if (parseInt(option.dataset.source) === sourceKey) {
                    option.classList.add('active');
                } else {
                    option.classList.remove('active');
                }
            });

            // 更新按钮文本
            // const mapSourceBtn = document.getElementById('mapSourceBtn');
            // mapSourceBtn.innerHTML = `<i class="fas fa-layer-group"></i> ${mapSources[sourceKey].name}`;
        }

        // 初始化地图源切换事件
        function initMapSourceEvents() {
            // 地图源选项点击事件
            document.querySelectorAll('.map-source-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.preventDefault();
                    const sourceKey = parseInt(this.dataset.source);
                    switchMapSource(sourceKey);
                });
            });
        }

        // 解密函数
        function decryptData() {
            const password = document.getElementById('viewerPassword').value;
            if (!password) {
                alert('请输入密码');
                return;
            }

            try {
                // 提取盐、IV和加密数据
                const encryptedData = a.data;
                const salt = CryptoJS.enc.Hex.parse(encryptedData.substring(0, 32));
                const iv = CryptoJS.enc.Hex.parse(encryptedData.substring(32, 64));
                const ciphertext = encryptedData.substring(64);

                // 使用PBKDF2派生密钥
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256/32,
                    iterations: 1000
                });

                // 解密数据
                const decrypted = CryptoJS.AES.decrypt(ciphertext, key, {
                    iv: iv,
                    padding: CryptoJS.pad.Pkcs7,
                    mode: CryptoJS.mode.CBC
                });

                // 转换为UTF-8字符串
                const decryptedStr = decrypted.toString(CryptoJS.enc.Utf8);

                // 解析JSON数据
                decryptedData = JSON.parse(decryptedStr);

                // 关闭模态框
                passwordModal.hide();

                // 手动移除模态框背景（添加这行代码）
                document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());

                // 清空密码字段
                document.getElementById('viewerPassword').value = '';

                // 加载照片和专辑数据
                loadPredefinedPhotos();
                loadAlbums();

                // 显示导出时间
                setTimeout(showUpdateNotification, 500);

                // 初始化壁纸数据
                initWallpaperData();

            } catch (error) {
                alert('解密失败，密码错误或数据已损坏');
                // 清空密码字段
                document.getElementById('viewerPassword').value = '';
                document.getElementById('viewerPassword').focus();
            }
        }

        // 加载预置的照片数据
        function loadPredefinedPhotos() {
            if (!decryptedData) {
                // 显示密码输入框
                const passwordModal = new bootstrap.Modal(document.getElementById('passwordModal'));
                passwordModal.show();
                return;
            }

            // 确保移除所有模态框背景（添加这行代码）
            document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());

            decryptedData.photos.forEach(photo => {
                addPhotoToMap(photo);
            });

            // 更新照片聚类
            updatePhotoClusters();

            // 确保地图可以交互（添加这行代码）
            map.getContainer().style.pointerEvents = 'auto';
        }

        // 添加照片到地图
        function addPhotoToMap(photo) {
            // 创建自定义标记
            const marker = L.marker([photo.lat, photo.lng], {
                icon: L.divIcon({
                    className: 'photo-marker fade-in',
                    html: `<img src="${SERVER_HOST}${photo.thumb}" alt="${photo.filename}">`,
                    iconSize: [photo.thumbWidth, photo.thumbHeight],
                    iconAnchor: [photo.thumbWidth/2, photo.thumbHeight/2]
                })
            });

            // 存储照片数据
            marker.photoData = photo;

            // 添加点击事件
            marker.on('click', function() {
                showPhotoViewer([marker], 0);
            });

            // 添加到地图
            marker.addTo(map);
            photoMarkers.push(marker);
        }

        // 更新照片聚类
        function updatePhotoClusters() {
            // 清空现有聚类
            for (const key in photoClusters) {
                map.removeLayer(photoClusters[key]);
            }
            photoClusters = {};

            // 按位置分组照片
            const groupedMarkers = {};
            const clusterDistance = 0.01; // 聚类距离（经纬度）

            photoMarkers.forEach(marker => {
                const lat = marker.getLatLng().lat;
                const lng = marker.getLatLng().lng;

                // 查找附近的现有聚类
                let foundCluster = false;
                for (const key in groupedMarkers) {
                    const [clusterLat, clusterLng] = key.split(',').map(Number);
                    const distance = Math.sqrt(Math.pow(lat - clusterLat, 2) + Math.pow(lng - clusterLng, 2));

                    if (distance < clusterDistance) {
                        groupedMarkers[key].push(marker);
                        foundCluster = true;
                        break;
                    }
                }

                // 如果没有找到附近的聚类，创建新聚类
                if (!foundCluster) {
                    const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
                    groupedMarkers[key] = [marker];
                }
            });

            // 为每个组创建聚类标记
            for (const key in groupedMarkers) {
                const markers = groupedMarkers[key];

                if (markers.length > 1) {
                    // 创建聚类标记 - 显示叠加的照片
                    const centerLat = markers.reduce((sum, m) => sum + m.getLatLng().lat, 0) / markers.length;
                    const centerLng = markers.reduce((sum, m) => sum + m.getLatLng().lng, 0) / markers.length;

                    // 创建叠加照片的HTML
                    let clusterHtml = '<div class="photo-cluster">';

                    // 最多显示4张照片的叠加
                    const maxPhotosToShow = Math.min(4, markers.length);
                    for (let i = 0; i < maxPhotosToShow; i++) {
                        // 随机旋转角度 (-15° 到 +15°)
                        const rotation = (Math.random() * 30) - 15;

                        // 随机偏移 (-5px 到 +5px)
                        const offsetX = (Math.random() * 10) - 5;
                        const offsetY = (Math.random() * 10) - 5;

                        const thumbWidth = markers[i].photoData.thumbWidth;
                        const thumbHeight = markers[i].photoData.thumbHeight;
                        const aspectRatio = thumbWidth / thumbHeight;
                        // 根据宽高比设置显示尺寸
                        let displayWidth, displayHeight;
                        if (aspectRatio > 1) {
                            // 横版照片
                            displayWidth = i === 0 ? 70 : 60;
                            displayHeight = displayWidth / aspectRatio;
                        } else {
                            // 竖版照片
                            displayHeight = i === 0 ? 70 : 60;
                            displayWidth = displayHeight * aspectRatio;
                        }

                        clusterHtml += `
                            <div class="cluster-photo" style="
                                transform: rotate(${rotation}deg);
                                z-index: ${maxPhotosToShow - i};
                                left: ${offsetX}px;
                                top: ${offsetY}px;
                                width: ${displayWidth}px;
                                height: ${displayHeight}px;
                            ">
                                <img src="${SERVER_HOST}${markers[i].photoData.thumb}" alt="Photo">
                            </div>
                        `;
                    }

                    // 添加照片数量指示器
                    if (markers.length > maxPhotosToShow) {
                        clusterHtml += `<div class="cluster-count">${markers.length}</div>`;
                    }

                    clusterHtml += '</div>';

                    const cluster = L.marker([centerLat, centerLng], {
                        icon: L.divIcon({
                            className: 'fade-in',
                            html: clusterHtml,
                            iconSize: [80, 80],
                            iconAnchor: [40, 40]
                        })
                    });

                    // 添加点击事件
                    cluster.on('click', function() {
                        showPhotoViewer(markers, 0);
                    });

                    // 添加到地图和聚类对象
                    cluster.addTo(map);
                    photoClusters[key] = cluster;

                    // 隐藏单个标记
                    markers.forEach(marker => {
                        map.removeLayer(marker);
                    });
                } else {
                    // 单个照片，确保显示在地图上
                    if (!map.hasLayer(markers[0])) {
                        markers[0].addTo(map);
                    }
                }
            }
        }

        // 搜索位置函数
        function searchLocation(address = null) {
            const searchInput = document.getElementById('search-input');
            const addressToSearch = address || searchInput.value.trim();

            if (!addressToSearch) {
                alert('请输入要搜索的地址');
                return;
            }

            // 使用高德地图地理编码API
            const encodedAddress = encodeURIComponent(addressToSearch);
            const url = `https://restapi.amap.com/v3/geocode/geo?address=${encodedAddress}&output=JSON&key=${amapKey}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.status === '1' && data.geocodes && data.geocodes.length > 0) {
                        const location = data.geocodes[0].location;
                        const [lng, lat] = location.split(',').map(Number);

                        // 移动到搜索到的位置
                        map.setView([lat, lng], 15);

                        // 清除之前的搜索标记
                        if (searchMarker) {
                            map.removeLayer(searchMarker);
                        }

                        // 添加新标记
                        searchMarker = L.marker([lat, lng]).addTo(map);

                        // 添加弹出窗口
                        searchMarker.bindPopup(`
                            <div style="text-align: center;">
                                <strong>${data.geocodes[0].formatted_address}</strong><br>
                                <small>${data.geocodes[0].province} ${data.geocodes[0].city} ${data.geocodes[0].district}</small>
                            </div>
                        `).openPopup();

                        // 隐藏候选结果
                        hideSuggestions();
                    } else {
                        alert('未找到该地址，请尝试更具体的地址描述');
                    }
                })
                .catch(error => {
                    console.error('搜索失败:', error);
                    alert('搜索失败，请检查网络连接或稍后重试');
                });
        }

        // 输入时搜索候选结果
        let searchTimeout = null;
        let currentSuggestions = [];

        function initSearchSuggestions() {
            const searchInput = document.getElementById('search-input');

            // 输入事件监听
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.trim();

                // 清除之前的定时器
                if (searchTimeout) {
                    clearTimeout(searchTimeout);
                }

                // 如果查询为空，隐藏候选结果
                if (!query) {
                    hideSuggestions();
                    return;
                }

                // 设置延迟搜索（防抖）
                searchTimeout = setTimeout(() => {
                    fetchSuggestions(query);
                }, 300);
            });

            // 键盘事件监听
            searchInput.addEventListener('keydown', function(e) {
                const suggestionsContainer = document.getElementById('search-suggestions');
                const suggestionsList = document.getElementById('suggestions-list');

                if (suggestionsContainer.style.display === 'none') return;

                const items = suggestionsList.querySelectorAll('.suggestion-item');
                let activeIndex = -1;

                // 找到当前激活的项
                items.forEach((item, index) => {
                    if (item.classList.contains('active')) {
                        activeIndex = index;
                    }
                });

                switch (e.key) {
                    case 'ArrowDown':
                        e.preventDefault();
                        if (activeIndex < items.length - 1) {
                            setActiveSuggestion(activeIndex + 1);
                        } else {
                            setActiveSuggestion(0);
                        }
                        break;

                    case 'ArrowUp':
                        e.preventDefault();
                        if (activeIndex > 0) {
                            setActiveSuggestion(activeIndex - 1);
                        } else {
                            setActiveSuggestion(items.length - 1);
                        }
                        break;

                    case 'Enter':
                        e.preventDefault();
                        if (activeIndex >= 0 && currentSuggestions[activeIndex]) {
                            selectSuggestion(currentSuggestions[activeIndex]);
                        } else {
                            searchLocation();
                        }
                        break;

                    case 'Escape':
                        hideSuggestions();
                        break;
                }
            });

            // 点击外部隐藏候选结果
            document.addEventListener('click', function(e) {
                const suggestionsContainer = document.getElementById('search-suggestions');
                const searchInput = document.getElementById('search-input');

                if (!suggestionsContainer.contains(e.target) && e.target !== searchInput) {
                    hideSuggestions();
                }
            });
        }

        // 获取候选结果
        function fetchSuggestions(query) {
            const encodedQuery = encodeURIComponent(query);
            const url = `https://restapi.amap.com/v3/assistant/inputtips?keywords=${encodedQuery}&city=全国&output=JSON&key=${amapKey}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.status === '1' && data.tips && data.tips.length > 0) {
                        currentSuggestions = data.tips;
                        showSuggestions(data.tips);
                    } else {
                        hideSuggestions();
                    }
                })
                .catch(error => {
                    console.error('获取候选结果失败:', error);
                    hideSuggestions();
                });
        }

        // 显示候选结果
        function showSuggestions(suggestions) {
            const suggestionsList = document.getElementById('suggestions-list');
            const suggestionsContainer = document.getElementById('search-suggestions');

            suggestionsList.innerHTML = '';

            suggestions.forEach((suggestion, index) => {
                const item = document.createElement('div');
                item.className = 'suggestion-item list-group-item list-group-item-action';
                item.dataset.index = index;

                // 构建显示内容
                let title = suggestion.name;
                let address = suggestion.district || '';
                let region = '';

                if (suggestion.address) {
                    address = suggestion.address;
                }

                if (suggestion.city) {
                    region = suggestion.province ? `${suggestion.province} ${suggestion.city}` : suggestion.city;
                }

                item.innerHTML = `
                    <div class="suggestion-title">${title}</div>
                    ${address ? `<div class="suggestion-address">${address}</div>` : ''}
                    ${region ? `<div class="suggestion-region">${region}</div>` : ''}
                `;

                item.addEventListener('click', () => {
                    selectSuggestion(suggestion);
                });

                item.addEventListener('mouseenter', () => {
                    setActiveSuggestion(index);
                });

                suggestionsList.appendChild(item);
            });

            // 显示容器
            suggestionsContainer.style.display = 'block';

            // 设置第一个项为激活状态
            if (suggestions.length > 0) {
                setActiveSuggestion(0);
            }
        }

        // 设置激活的候选项

            items.forEach(item => {

                items[index].classList.add('active');

        // 显示照片查看器
        function showPhotoViewer(markers, index) {

        // 更新照片详情

            document.getElementById('detailLocation').textContent =
                `${marker.photoData.lat.toFixed(6)}, ${marker.photoData.lng.toFixed(6)}`;

            document.getElementById('detailDimensions').textContent =
                `${marker.photoData.width || '未知'} × ${marker.photoData.height || '未知'}`;

        // 更新照片预览
        function updatePhotoPreviews() {
            const photoPreview = document.getElementById('photoPreview');
            photoPreview.innerHTML = '';

            if (currentViewerMarkers.length === 0) return;

            // 重置滚动位置
            previewScrollPosition = 0;

            // 添加所有预览图
            currentViewerMarkers.forEach((marker, i) => {
                const previewItem = document.createElement('div');
                previewItem.className = `preview-item ${i === currentPhotoIndex ? 'active' : ''}`;
                previewItem.dataset.index = i;

                const img = document.createElement('img');
                img.src = SERVER_HOST + marker.photoData.thumb;
                img.alt = `预览图 ${i + 1}`;

                previewItem.appendChild(img);
                previewItem.addEventListener('click', () => {
                    navigateToPhoto(i);
                });

                photoPreview.appendChild(previewItem);
            });

            // 添加总照片数量显示
            if (currentViewerMarkers.length > 1) {
                const totalCount = document.createElement('div');
                totalCount.className = 'total-photo-count';
                totalCount.textContent = `${currentPhotoIndex + 1}/${currentViewerMarkers.length}`;
                photoPreview.parentNode.appendChild(totalCount);
            }

            // 更新导航按钮状态
            updatePreviewNavButtons();

            // 确保当前选中的照片在可视区域内
            ensureActivePreviewVisible();
        }

        // 滚动预览栏
        function scrollPreviews(direction) {
            const photoPreview = document.getElementById('photoPreview');
            const previewItems = photoPreview.querySelectorAll('.preview-item');

            if (previewItems.length <= PREVIEWS_VISIBLE) return;

            // 计算新的滚动位置
            const maxScroll = previewItems.length - PREVIEWS_VISIBLE;
            previewScrollPosition = Math.max(0, Math.min(maxScroll, previewScrollPosition + direction));

            // 计算滚动距离
            const itemWidth = previewItems[0].offsetWidth + parseInt(getComputedStyle(photoPreview).gap);
            const scrollDistance = previewScrollPosition * itemWidth;

            // 执行滚动
            photoPreview.scrollTo({
                left: scrollDistance,
                behavior: 'smooth'
            });

            // 更新导航按钮状态
            updatePreviewNavButtons();
        }

        // 更新导航按钮状态
        function updatePreviewNavButtons() {
            const prevBtn = document.querySelector('.preview-prev-btn');
            const nextBtn = document.querySelector('.preview-next-btn');
            const previewItems = document.getElementById('photoPreview').querySelectorAll('.preview-item');

            // 显示/隐藏导航按钮
            if (previewItems.length <= PREVIEWS_VISIBLE) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';

                // 更新按钮状态
                prevBtn.disabled = previewScrollPosition === 0;
                nextBtn.disabled = previewScrollPosition >= previewItems.length - PREVIEWS_VISIBLE;

                // 添加/移除禁用样式
                if (prevBtn.disabled) {
                    prevBtn.classList.add('disabled');
                } else {
                    prevBtn.classList.remove('disabled');
                }

                if (nextBtn.disabled) {
                    nextBtn.classList.add('disabled');
                } else {
                    nextBtn.classList.remove('disabled');
                }
            }
        }

        // 确保当前选中的预览图在可视区域内
        function ensureActivePreviewVisible() {
            const photoPreview = document.getElementById('photoPreview');
            const activePreview = photoPreview.querySelector('.preview-item.active');
            const previewItems = photoPreview.querySelectorAll('.preview-item');

            if (!activePreview || previewItems.length <= PREVIEWS_VISIBLE) return;

            const activeIndex = parseInt(activePreview.dataset.index);

            // 如果当前选中的预览图不在可视区域内，调整滚动位置
            if (activeIndex < previewScrollPosition || activeIndex >= previewScrollPosition + PREVIEWS_VISIBLE) {
                previewScrollPosition = Math.max(0, Math.min(
                    previewItems.length - PREVIEWS_VISIBLE,
                    activeIndex - Math.floor(PREVIEWS_VISIBLE / 2)
                ));

                const itemWidth = previewItems[0].offsetWidth + parseInt(getComputedStyle(photoPreview).gap);
                const scrollDistance = previewScrollPosition * itemWidth;

                photoPreview.scrollTo({
                    left: scrollDistance,
                    behavior: 'smooth'
                });

                // 更新导航按钮状态
                updatePreviewNavButtons();
            }
        }

        // 导航到指定照片时更新预览栏
        function navigateToPhoto(index) {
            if (index < 0 || index >= currentViewerMarkers.length) return;

            currentPhotoIndex = index;
            updatePhotoDisplay();

            // 更新预览项激活状态
            const previewItems = document.getElementById('photoPreview').querySelectorAll('.preview-item');
            previewItems.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // 更新总照片数量显示
            const totalCount = document.querySelector('.total-photo-count');
            if (totalCount) {
                totalCount.textContent = `${currentPhotoIndex + 1}/${currentViewerMarkers.length}`;
            }

            // 确保当前选中的预览图在可视区域内
            ensureActivePreviewVisible();
        }

        // 导航照片（向前或向后）
        function navigatePhoto(direction) {
            let newIndex = currentPhotoIndex + direction;

            // 循环导航
            if (newIndex < 0) {
                newIndex = currentViewerMarkers.length - 1;
            } else if (newIndex >= currentViewerMarkers.length) {
                newIndex = 0;

            navigateToPhoto(newIndex);

        // ==================== 壁纸功能 ====================

        // 初始化壁纸数据
        function initWallpaperData() {
            if (!decryptedData || !decryptedData.photos) return;

            // 复制所有照片数据
            wallpaperPhotos = [...decryptedData.photos];

            // 随机打乱照片顺序
            shuffleArray(wallpaperPhotos);

            console.log(`壁纸模式初始化完成，共 ${wallpaperPhotos.length} 张照片`);
        }

        // 随机打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化壁纸迷你地图
        function initWallpaperMiniMap() {
            if (wallpaperMiniMap) {
                wallpaperMiniMap.remove();
                wallpaperMiniMap = null;
                wallpaperMapMarker = null;
            }

            const mapContainer = document.getElementById('wallpaperMapContainer');
            const miniMapElement = document.getElementById('wallpaperMiniMap');

            // 清除之前的容器内容
            miniMapElement.innerHTML = '';

            // 创建迷你地图 - 固定视角显示中国版图
            wallpaperMiniMap = L.map('wallpaperMiniMap').setView([35.8617, 104.1954], 3); // 中国中心点，缩放级别4显示完整中国地图

            // 添加高德地图瓦片（使用标准地图样式）
            L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7', {
                subdomains: ['1', '2', '3', '4'],
                maxZoom: 18,
                minZoom: 2
            }).addTo(wallpaperMiniMap);

            // 设置地图容器样式
            mapContainer.style.display = 'block';
            mapContainer.classList.remove('hidden');
        }

        // 更新地图标记位置
        function updateWallpaperMapMarker(photo) {
            if (!wallpaperMiniMap || !wallpaperShowMap) return;

            console.log('更新地图标记，照片经纬度:', photo.lat, photo.lng);

            // 移除之前的标记
            if (wallpaperMapMarker) {
                wallpaperMiniMap.removeLayer(wallpaperMapMarker);
            }

            // 如果有地理位置信息，添加新标记
            if (photo.lat && photo.lng) {
                console.log('添加地图标记到位置:', [photo.lat, photo.lng]);
                wallpaperMiniMap.setView([photo.lat, photo.lng]);
                wallpaperMapMarker = L.marker([photo.lat, photo.lng]).addTo(wallpaperMiniMap);

                // 保持地图固定视角，不跟随标记移动
                // 地图已固定显示中国版图，标记会自动显示在对应位置
            } else {
                console.log('照片没有经纬度信息');
            }
        }

        // 显示或隐藏地图容器
        function toggleWallpaperMap(show) {

            if (show) {
                mapContainer.style.display = 'block';
                mapContainer.classList.remove('hidden');
            } else {

        // 开始壁纸模式
        function startWallpaperMode() {

                return;
            }

            // 设置壁纸模式标志

        // 显示壁纸照片
        function showWallpaperPhoto(index) {
            if (index < 0 || index >= wallpaperPhotos.length) return;

            const photo = wallpaperPhotos[index];
            const container = document.getElementById('wallpaperContainer');

            // 先淡出当前图片（如果有的话）
            const currentBackground = container.querySelector('.wallpaper-background.active');
            const currentForeground = container.querySelector('.wallpaper-foreground.active');

            if (currentBackground && currentForeground) {
                if (wallpaperAnimation) {
                    currentBackground.classList.remove('active');
                    currentForeground.classList.remove('active');

                    // 等待淡出动画完成后再创建新图片
                    setTimeout(() => {
                        container.innerHTML = '';
                        createNewImages();
                    }, 800); // 稍微短于过渡时间，确保平滑
                } else {
                    // 如果动画关闭，直接移除并创建新图片
                    container.innerHTML = '';
                    createNewImages();
                }
            } else {
                // 没有当前图片，直接创建
                container.innerHTML = '';
                createNewImages();
            }

            function createNewImages() {
                // 创建背景层（高斯模糊、铺满屏幕）
                const backgroundImg = document.createElement('img');
                backgroundImg.className = 'wallpaper-background';
                backgroundImg.src = SERVER_HOST + photo.full;
                backgroundImg.alt = photo.filename + ' (背景)';

                // 创建前景层（圆角、95%缩放）
                const foregroundImg = document.createElement('img');
                foregroundImg.className = 'wallpaper-image';
                foregroundImg.src = SERVER_HOST + photo.full;
                foregroundImg.alt = photo.filename;

                // 创建前景容器
                const foregroundContainer = document.createElement('div');
                foregroundContainer.className = 'wallpaper-foreground';
                foregroundContainer.appendChild(foregroundImg);

                // 如果动画关闭，立即添加禁用过渡的类并设置可见
                if (!wallpaperAnimation) {
                    backgroundImg.classList.add('wallpaper-no-transition');
                    foregroundImg.classList.add('wallpaper-no-transition');
                    foregroundContainer.classList.add('wallpaper-no-transition');

                    // 立即设置可见状态，避免黑屏
                    backgroundImg.style.opacity = '1';
                    backgroundImg.style.filter = 'blur(20px) brightness(0.8) saturate(1.1)';
                    foregroundImg.style.opacity = '1';
                    foregroundContainer.style.opacity = '1';
                    foregroundContainer.style.transform = 'translate(-50%, -50%) scale(1)';
                }

                // 等待图片加载完成
                let loadedCount = 0;
                const totalImages = 2;

                function onImageLoad() {
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        // 两张图片都加载完成后
                        processImages();
                    }
                }

                backgroundImg.onload = onImageLoad;
                foregroundImg.onload = onImageLoad;

                // 如果图片已经缓存，手动触发onload
                if (backgroundImg.complete) onImageLoad();
                if (foregroundImg.complete) onImageLoad();

                // 添加到容器
                container.appendChild(backgroundImg);
                container.appendChild(foregroundContainer);

                function processImages() {
                    // 计算照片在用户设置的比例限制下的显示比例
                    const maxWidth = window.innerWidth * wallpaperScale;
                    const maxHeight = window.innerHeight * wallpaperScale;

                    const photoAspectRatio = foregroundImg.naturalWidth / foregroundImg.naturalHeight;
                    const screenAspectRatio = maxWidth / maxHeight;

                    // 判断哪个维度会先达到限制
                    // 如果照片宽高比 > 屏幕宽高比，说明宽度会先达到限制（宽度优先）
                    // 如果照片宽高比 <= 屏幕宽高比，说明高度会先达到限制（高度优先）
                    const isWidthLimited = photoAspectRatio > screenAspectRatio;

                    // 移除之前的分类和内联样式
                    foregroundImg.classList.remove('width-limited', 'height-limited');
                    foregroundImg.style.width = '';
                    foregroundImg.style.height = '';
                    foregroundImg.style.maxWidth = '';
                    foregroundImg.style.maxHeight = '';

                    // 根据用户设置的比例动态设置样式
                    const maxWidthPx = window.innerWidth * wallpaperScale;
                    const maxHeightPx = window.innerHeight * wallpaperScale;
                    const maxWidthVw = wallpaperScale * 100;
                    const maxHeightVh = wallpaperScale * 100;

                    if (isWidthLimited) {
                        // 宽度优先 - 照片宽度会先达到限制
                        foregroundImg.style.maxWidth = `${maxWidthPx}px`;
                        foregroundImg.style.width = `${maxWidthPx}px`;
                        foregroundImg.style.height = 'auto';
                        foregroundImg.style.maxHeight = `${maxHeightPx}px`;
                    } else {
                        // 高度优先 - 照片高度会先达到限制
                        foregroundImg.style.maxHeight = `${maxHeightPx}px`;
                        foregroundImg.style.height = `${maxHeightPx}px`;
                        foregroundImg.style.width = 'auto';
                        foregroundImg.style.maxWidth = `${maxWidthPx}px`;
                    }

                    // 设置容器的最大尺寸
                    foregroundContainer.style.maxWidth = `${maxWidthPx}px`;
                    foregroundContainer.style.maxHeight = `${maxHeightPx}px`;

                    // 显示图片的函数
                    function showImages() {
                        if (wallpaperAnimation) {
                            // 启用动画：移除禁用过渡的类，添加active类触发过渡效果
                            backgroundImg.classList.remove('wallpaper-no-transition');
                            foregroundImg.classList.remove('wallpaper-no-transition');
                            foregroundContainer.classList.remove('wallpaper-no-transition');
                            backgroundImg.classList.add('active');
                            foregroundImg.classList.add('active');
                            foregroundContainer.classList.add('active');
                        } else {
                            // 禁用动画：添加禁用过渡的类，直接设置最终状态
                            backgroundImg.classList.add('wallpaper-no-transition');
                            foregroundImg.classList.add('wallpaper-no-transition');
                            foregroundContainer.classList.add('wallpaper-no-transition');
                            backgroundImg.style.opacity = '1';
                            backgroundImg.style.filter = 'blur(20px) brightness(0.8) saturate(1.1)';
                            foregroundImg.style.opacity = '1';
                            foregroundContainer.style.opacity = '1';
                            foregroundContainer.style.transform = 'translate(-50%, -50%) scale(1)';
                        }

                        // 更新信息显示
                        document.getElementById('wallpaperCurrent').textContent = index + 1;
                        document.getElementById('wallpaperTotal').textContent = wallpaperPhotos.length;
                        document.getElementById('wallpaperFilename').textContent = photo.filename;

                        // 更新地图标记
                        updateWallpaperMapMarker(photo);

                        // // 重置信息显示
                        // const wallpaperInfo = document.getElementById('wallpaperInfo');
                        // wallpaperInfo.classList.remove('hidden');

                        // 重置进度条
                        resetWallpaperProgress();

                        // 更新当前索引
                        wallpaperCurrentIndex = index;
                    }

                    // 根据动画设置决定何时显示图片
                    if (wallpaperAnimation) {
                        // 启用动画：使用setTimeout确保DOM更新后再显示图片
                        setTimeout(showImages, 100);
                    } else {
                        // 禁用动画：立即显示图片，避免黑屏
                        showImages();
                    }
                } // processImages函数结束
            } // createNewImages函数结束
        } // showWallpaperPhoto函数结束

        // 开始壁纸轮播间隔
        function startWallpaperInterval() {
            if (wallpaperInterval) {
                clearInterval(wallpaperInterval);
            }

            if (wallpaperIsPlaying) {
                wallpaperInterval = setInterval(() => {
                    nextWallpaper();
                }, wallpaperIntervalTime);

                // 开始进度条动画
                startWallpaperProgress();
            }
        }

        // 检查当前照片是否需要滚动
        // 停止壁纸轮播
        function stopWallpaperInterval() {
            if (wallpaperInterval) {
                clearInterval(wallpaperInterval);
                wallpaperInterval = null;
            }

            // 停止进度条
            stopWallpaperProgress();
        }

        // 上一张壁纸
        function prevWallpaper() {
            let newIndex = wallpaperCurrentIndex - 1;
            if (newIndex < 0) {
                newIndex = wallpaperPhotos.length - 1;
            }
            showWallpaperPhoto(newIndex);

            // 重置轮播间隔
            if (wallpaperIsPlaying) {
                stopWallpaperInterval();
                startWallpaperInterval();
            }
        }

        // 下一张壁纸
        function nextWallpaper() {
            let newIndex = wallpaperCurrentIndex + 1;
            if (newIndex >= wallpaperPhotos.length) {
                newIndex = 0;
            }
            showWallpaperPhoto(newIndex);
        }

        // 切换壁纸播放/暂停
        function toggleWallpaperPlay() {
            wallpaperIsPlaying = !wallpaperIsPlaying;

            const playBtn = document.getElementById('wallpaperPlayBtn');
            const playIcon = document.getElementById('wallpaperPlayIcon');

            if (wallpaperIsPlaying) {
                playIcon.className = 'fas fa-pause';
                startWallpaperInterval();
            } else {
                playIcon.className = 'fas fa-play';
                stopWallpaperInterval();
            }
        }

        // 开始进度条动画
        function startWallpaperProgress() {
            if (wallpaperProgressInterval) {
                clearInterval(wallpaperProgressInterval);
            }

            wallpaperStartTime = Date.now();
            const progressBar = document.getElementById('wallpaperProgressBar');
            progressBar.style.width = '0%';

            wallpaperProgressInterval = setInterval(() => {
                const elapsed = Date.now() - wallpaperStartTime;
                const progress = Math.min((elapsed / wallpaperIntervalTime) * 100, 100);
                progressBar.style.width = progress + '%';

                if (progress >= 100) {
                    clearInterval(wallpaperProgressInterval);
                }
            }, 50);
        }

        // 停止进度条
        function stopWallpaperProgress() {
            if (wallpaperProgressInterval) {
                clearInterval(wallpaperProgressInterval);
                wallpaperProgressInterval = null;
            }
        }

        // 重置进度条
        function resetWallpaperProgress() {
            stopWallpaperProgress();
            const progressBar = document.getElementById('wallpaperProgressBar');
            progressBar.style.width = '0%';

            if (wallpaperIsPlaying) {
                startWallpaperProgress();
            }
        }

            exitHint.style.opacity = '0.7';

            setTimeout(() => {

            }, 3000);
        }

        // 添加壁纸事件监听器
        function addWallpaperEventListeners() {
            // ESC键退出
            document.addEventListener('keydown', handleWallpaperKeydown);

            // 点击屏幕退出
            document.getElementById('wallpaperMode').addEventListener('click', handleWallpaperClick);

            // 防止控制按钮触发点击退出
            document.querySelector('.wallpaper-controls').addEventListener('click', function(e) {
                e.stopPropagation();
            });

            document.querySelector('.wallpaper-info').addEventListener('click', function(e) {
                e.stopPropagation();
            });

            // 窗口大小变化时重新计算照片显示
            window.addEventListener('resize', handleWallpaperResize);

            // 鼠标移动检测 - 显示控制栏和鼠标指针
            document.addEventListener('mousemove', handleWallpaperMouseMove);
            document.addEventListener('touchstart', handleWallpaperMouseMove);

            // 初始隐藏定时器
            startWallpaperHideTimer();
        }

        // 移除壁纸事件监听器
        function removeWallpaperEventListeners() {
            document.removeEventListener('keydown', handleWallpaperKeydown);
            document.getElementById('wallpaperMode').removeEventListener('click', handleWallpaperClick);
            window.removeEventListener('resize', handleWallpaperResize);
            document.removeEventListener('mousemove', handleWallpaperMouseMove);
            document.removeEventListener('touchstart', handleWallpaperMouseMove);

            // 清除隐藏定时器
            clearWallpaperHideTimer();
        }

        // 处理鼠标移动 - 显示控制栏和鼠标指针
        function handleWallpaperMouseMove() {
            if (!wallpaperMode) return;

            showWallpaperControls();
            startWallpaperHideTimer();

        // 显示控制栏和鼠标指针
        function showWallpaperControls() {
            if (!wallpaperMode) return;

            const wallpaperModeEl = document.getElementById('wallpaperMode');
            const controls = document.querySelector('.wallpaper-controls');
            const info = document.getElementById('wallpaperInfo');
            const exitHint = document.getElementById('wallpaperExitHint');
            const mapContainer = document.getElementById('wallpaperMapContainer');

            // 显示鼠标指针
            wallpaperModeEl.classList.remove('cursor-hidden');

            // 显示控制栏

            if (info) info.classList.remove('hidden');
            if (exitHint) exitHint.classList.remove('hidden');
            if (mapContainer && wallpaperShowMap) mapContainer.classList.remove('hidden');

        // 隐藏控制栏和鼠标指针
        function hideWallpaperControls() {
            if (!wallpaperMode || !wallpaperControlsVisible) return;

            const wallpaperModeEl = document.getElementById('wallpaperMode');
            const controls = document.querySelector('.wallpaper-controls');

            if (mapContainer && wallpaperShowMap) mapContainer.classList.add('hidden');

            wallpaperControlsVisible = false;
        }

        // 开始隐藏定时器
        function startWallpaperHideTimer() {
            clearWallpaperHideTimer();

        // 处理壁纸键盘事件
        function handleWallpaperKeydown(e) {
            if (!wallpaperMode) return;

            switch(e.key) {
                case 'Escape':
                    exitWallpaperMode();
                    break;
                case 'ArrowLeft':
                    prevWallpaper();
                    break;
                case 'ArrowRight':
                    nextWallpaper();
                    break;
                case ' ':
                    toggleWallpaperPlay();
                    e.preventDefault(); // 防止空格键滚动页面
                    break;
            }
        }

        function handleWallpaperClick(e) {

            if (e.target.id === 'wallpaperMode' || e.target.classList.contains('wallpaper-image')) {
                exitWallpaperMode();
            }

            if (!wallpaperMode) return;

            // 停止轮播
            stopWallpaperInterval();

            removeWallpaperEventListeners();

            // 清理地图资源

                wallpaperMiniMap = null;
                wallpaperMapMarker = null;

            const mapContainer = document.getElementById('wallpaperMapContainer');

            wallpaperModeEl.classList.remove('active');

            document.querySelector('.navbar').style.display = '';
            document.getElementById('map').style.display = '';

            wallpaperMode = false;

            document.getElementById('wallpaperContainer').innerHTML = '';

        // 绘制单条路线（同时收集边界点）
        function drawRoute(route, boundsArray) {
            const color = getRouteColor(route.id);
            const coords = route.route_data.coordinates;

            // ----- 路线线段 + 方向箭头 -----
            if (coords?.length) {
                // // 白色虚线描边

                    // 计算路线中点

                    const mid = parseInt(route.route_data.coordinates.length / 2);
                    const avgLat = coords[mid][0];

                        waypointsHtml += '</ul>';
                    } else {
                        waypointsHtml = '<p style="margin:5px 0 0 0; color:#999;">无途径点</p>';
                    }

                    // 弹框内容
                    const content = `

                    // 创建 Leaflet 弹框
                    const popup = L.popup({
                        autoClose: false,      // 不自动关闭

                    })

                        .setContent(content)
                        .openOn(map);

                    // 将当前弹框引用保存在 route 对象上
                    route._popup = popup;
                });

                // 方向箭头（需引入 leaflet-polylinedecorator）
                if (typeof L.polylineDecorator !== 'undefined') {
                    L.polylineDecorator(mainLine, {
                        patterns: [{
                            // offset: '15%', 
                            // repeat: '30%',
                            repeat: 50,
                            symbol: L.Symbol.arrowHead({
                                pixelSize: 5, polygon: false,
                                pathOptions: { stroke: true, color: '#FFFFFF', weight: 3, opacity: 0.9 }
                            })
                        }]
                    }).addTo(routeLayerGroup);
                }
            }

            // ----- 起点标记 -----
            if (route.start_point?.lat && route.start_point?.lng) {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:#4CAF50; color:white; width:36px; height:36px; 
                            border-radius:50%; display:flex; align-items:center; justify-content:center;
                            font-weight:bold; font-size:14px; border:3px solid white; box-shadow:0 2px 8px rgba(0,0,0,0.3);">
                            起</div>`,
                    iconSize: [46, 46], iconAnchor: [23, 23]
                });
                L.marker([route.start_point.lat, route.start_point.lng], { icon })
                    .addTo(routeLayerGroup)
                    .bindPopup(`<b>起点 · ${route.name}</b><br>${route.start_point.name}<br>
                                ${route.start_point.day ? '第'+route.start_point.day+'天' : ''}`);
                boundsArray.push([route.start_point.lat, route.start_point.lng]);
            }

            // ----- 终点标记 -----
            if (route.end_point?.lat && route.end_point?.lng) {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:#F44336; color:white; width:36px; height:36px; 
                            border-radius:50%; display:flex; align-items:center; justify-content:center;
                            font-weight:bold; font-size:14px; border:3px solid white; box-shadow:0 2px 8px rgba(0,0,0,0.3);">
                            终</div>`,
                    iconSize: [46, 46], iconAnchor: [23, 23]
                });
                L.marker([route.end_point.lat, route.end_point.lng], { icon })
                    .addTo(routeLayerGroup)
                    .bindPopup(`<b>终点 · ${route.name}</b><br>${route.end_point.name}<br>
                                ${route.end_point.day ? '第'+route.end_point.day+'天' : ''}`);
                boundsArray.push([route.end_point.lat, route.end_point.lng]);
            }

            // ----- 途径点标记 -----
            if (route.waypoints?.length) {
                route.waypoints.forEach((wp, i) => {
                    if (!wp.lat || !wp.lng) return;
                    const icon = L.divIcon({
                        className: '',
                        html: `<div style="background:${color}; color:white; width:32px; height:32px;
                                border-radius:50%; display:flex; align-items:center; justify-content:center;
                                font-weight:bold; font-size:12px; border:2px solid white;">
                                ${i + 1}</div>`,
                        iconSize: [36, 36], iconAnchor: [18, 18]
                    });
                    L.marker([wp.lat, wp.lng], { icon })
                        .addTo(routeLayerGroup)
                        .bindPopup(`<b>途径点 ${i+1} · ${route.name}</b><br>${wp.name}<br>
                                    第 ${wp.day || 1} 天${wp.time ? ' ' + wp.time : ''}`);
                    boundsArray.push([wp.lat, wp.lng]);
                });
            }

            // 同时收集路线上的所有坐标点（用于更精确的边界）
            if (coords?.length) {
                coords.forEach(p => boundsArray.push(p));
            }
        }
        // 显示数据更新提示
        function showUpdateNotification() {
            const updateNotification = document.getElementById('updateNotification');
            const updateTimeElement = document.getElementById('updateTime');
            
            // 获取当前时间
            const updateTime = decryptedData.exportDate;

            updateTimeElement.textContent = updateTime;
            
            // 显示弹窗
            updateNotification.classList.add('show');
            
            // 数秒后隐藏弹窗
            setTimeout(() => {

            }, 5000);
        }

        // 隐藏数据更新提示
        function hideUpdateNotification() {
            const updateNotification = document.getElementById('updateNotification');
            updateNotification.classList.remove('show');
        }
        // 显示路线浮框
        function showRouteFloat() {
            if (!decryptedData?.routes?.length) {
                alert('没有可用的路线数据');
                return;
            }
            routes = decryptedData.routes;
